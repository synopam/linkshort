<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Ditolak</title>
    <style>
        /* Mengatur halaman agar memenuhi layar dan menggunakan flexbox */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Kotak peringatan di tengah */
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 90%;
            border: 1px solid #dee2e6;
        }

        h1 {
            color: #dc3545;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Gaya teks kode/link agar menonjol */
        code {
            background-color: #e9ecef;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 15px;
            color: #d63384;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Website Tidak Bisa Direct!</h1>
        <p>Harap tulis alamat lengkap: <code>linkshort.sytes.abrdns.com/example</code></p>
    </div>

</body>
</html>
